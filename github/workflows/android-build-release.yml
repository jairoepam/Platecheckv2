name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Create key.properties for Gradle (android and root)
        run: |
          mkdir -p android || true
          cat > android/key.properties <<'EOF'
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cat > key.properties <<'EOF'
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission to gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build release APK (Gradle)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          elif [ -f android/gradlew ]; then
            pushd android
            ./gradlew assembleRelease --no-daemon
            popd
          else
            echo "Gradle wrapper not found at root or android/gradlew" && exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
